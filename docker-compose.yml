# ═══════════════════════════════════════════════════════════════════════════════════════
# TALPHA — chạy cả hệ thống bằng Docker (04/11/2026). Hướng dẫn: docs/POSTGRES.md
#
#   docker compose up -d                       # Postgres + dashboard + lịch việc nền
#   mở http://localhost:3200/admin             # → Khoá kết nối: dán token Meta, key POS từng nước
#   docker compose run --rm sync               # kéo số ngay, không chờ đầu giờ
#   docker compose run --rm migrate dem        # số dòng từng bảng
#   docker compose logs -f lich                # xem các việc nền chạy
#   docker compose --profile zalo up -d zalo   # bot Zalo (ghép nick trước: xem docs/POSTGRES.md)
#
# MÁY THỬ / MÁY NỘI BỘ: dashboard bỏ đăng nhập (DASHBOARD_PUBLIC) và mật khẩu Postgres là mặc định.
# Cổng chỉ mở cho chính máy này (127.0.0.1). Đưa ra internet thì phải bật đăng nhập và đổi mật khẩu.
#
# MỌI dữ liệu người dùng nhập nằm trong Postgres (15/11/2026, migration 0006): sao kê, vận đơn, thị
# trường, người dùng, và khoá Meta / POS / Pancake / 17TRACK nhập ở /admin → Khoá kết nối (bảng
# api_credentials, MÃ HOÁ bằng TALPHA_ENCRYPTION_KEY — đổi chìa này là khoá cũ không giải mã được nữa,
# phải nhập lại). File cũ (data/*.json, .env.khoa.local) được chép vào kho một lần ở bước migrate.
# ═══════════════════════════════════════════════════════════════════════════════════════
name: talpha

x-python: &python
  build:
    context: .
    dockerfile: ops/docker/sync.Dockerfile
  image: talpha-sync
  working_dir: /app
  volumes:
    - ./:/app
  env_file:
    - path: dashboard-ui/.env.local
      required: false
  environment:
    DATABASE_URL: postgresql://talpha:talpha@db:5432/talpha
    TALPHA_DOC_PASSWORD: ${TALPHA_DOC_PASSWORD:-chi-doc-may-thu}
    # Chìa mã hoá khoá kết nối trong kho (sync/core/khoa.py) — PHẢI trùng với dashboard bên dưới.
    TALPHA_ENCRYPTION_KEY: ${TALPHA_ENCRYPTION_KEY:-may-thu-doi-chia-nay-khi-dua-ra-ngoai}
    TALPHA_RULES: /app/config/talpha_rules.json
    TALPHA_REPO: /app
    TALPHA_APP_DIR: /app
    TALPHA_PYTHON: python
    # Việc nền gọi route của dashboard (chụp tồn kho, nạp vận đơn) qua mạng nội bộ compose.
    TALPHA_DASH_URL: http://dashboard:3000
    TALPHA_BASE_URL: http://dashboard:3000
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: talpha
      POSTGRES_PASSWORD: talpha
      POSTGRES_DB: talpha
    ports:
      - "127.0.0.1:${PG_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talpha -d talpha"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Bảng (db/migrations) + bộ view (db/views) — chạy mỗi lần `up`, chỉ làm phần còn thiếu.
  migrate:
    <<: *python
    entrypoint: ["python", "-m", "sync.core.pg"]
    command: ["migrate"]

  dashboard:
    image: node:22-bookworm-slim
    working_dir: /app/dashboard-ui
    command: ["sh", "/app/ops/docker/dashboard-dev.sh"]
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-3200}:3000"
    environment:
      DATABASE_URL: postgresql://talpha:talpha@db:5432/talpha
      TALPHA_DOC_PASSWORD: ${TALPHA_DOC_PASSWORD:-chi-doc-may-thu}
      TALPHA_ENCRYPTION_KEY: ${TALPHA_ENCRYPTION_KEY:-may-thu-doi-chia-nay-khi-dua-ra-ngoai}
      AUTH_URL: http://localhost:${DASHBOARD_PORT:-3200}
      NEXTAUTH_URL: http://localhost:${DASHBOARD_PORT:-3200}
      AUTH_SECRET: chi-dung-tren-may-thu-docker
      AUTH_TRUST_HOST: "true"
      DASHBOARD_PUBLIC: "true"
      NEXT_PUBLIC_DEPLOYMENT_MODE: talpha
      NEXT_PUBLIC_APP_NAME: TALPHA
      NEXT_TELEMETRY_DISABLED: "1"
      # Lưu Thị trường trên /admin → thoát tiến trình, docker bật lại với luật mới.
      TALPHA_TU_KHOI_DONG: "1"
    volumes:
      - ./:/app
      - dashboard_node_modules:/app/dashboard-ui/node_modules
      - dashboard_next:/app/dashboard-ui/.next
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Lịch việc nền — thay systemd timer của máy chủ (ops/docker/lich.py).
  lich:
    <<: *python
    command: ["python", "ops/docker/lich.py"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Kéo số một lần, tay: docker compose run --rm sync
  sync:
    <<: *python
    profiles: ["tay"]
    command: ["python", "sync/talpha/talpha_sync.py"]

  # Bot Zalo — tuỳ chọn. Ghép nick lần đầu: docker compose --profile zalo run --rm zalo node pair.js
  zalo:
    image: node:22-bookworm-slim
    profiles: ["zalo"]
    working_dir: /app/ops/zalo-alerts
    command: ["sh", "-c", "[ -d node_modules/zca-js ] || npm ci --no-audit --no-fund; exec node bot.js"]
    environment:
      TALPHA_DASHBOARD_URL: http://dashboard:3000
      TALPHA_REPO: /app
    volumes:
      - ./:/app
      - zalo_node_modules:/app/ops/zalo-alerts/node_modules
    depends_on:
      - dashboard
    restart: unless-stopped

volumes:
  pgdata:
  dashboard_node_modules:
  dashboard_next:
  zalo_node_modules:
